<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | Câmara Dicria</title>
    <link rel="stylesheet" href="css/estilo.css">
    <script src="js/menu.js" defer></script>
    <script src="js/data.js" defer></script>
</head>

<body>
    <header>
        <img src="imagens/logo.png" alt="Logotipo Câmara Dicria" width="80">
        <h1>Câmara Dicria</h1>
        <button id="menu-btn" aria-label="Abrir menu">☰</button>
        <nav id="menu">
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="diretorio.html">Diretório</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="associe-se.html">Associe-se</a></li>
                <li><a href="contato.html" class="ativo">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main class="hero">
        <h2>Entre em Contato</h2>
        <p>Tem dúvidas ou sugestões? Fale com a Câmara Dicria.</p>
        <form>
            <label for="nome">Nome:</label><br>
            <input type="text" id="nome" name="nome" required><br><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <label for="mensagem">Mensagem:</label><br>
            <textarea id="mensagem" name="mensagem" rows="5" required></textarea><br><br>

            <button type="submit" class="botao">Enviar</button>
        </form>
    </main>

    <footer>
        <p>&copy; <span id="ano"></span> Fabio Ricardo | WDD 231</p>
        <p>Última modificação: <span id="modificacao"></span></p>
    </footer>
</body>

</html>
