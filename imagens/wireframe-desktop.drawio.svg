<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 583 506" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe Desktop — Página Inicial do Curso WDD 231</title>
  <desc id="desc">Representação do layout desktop de referência, com logotipo e navegação, cards dos projetos, cursos e rodapé social.</desc>
  <defs>
