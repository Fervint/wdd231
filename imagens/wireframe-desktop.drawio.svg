      <stop offset="1" stop-color="#efeee9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#17343a" flood-opacity=".11"/>
    </filter>
  </defs>
  <rect width="583" height="506" fill="url(#bg)"/>
  <rect width="583" height="7" fill="#222"/>

