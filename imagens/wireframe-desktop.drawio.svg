      <text x="106" y="332"><tspan font-weight="700">WDD130</tspan> (WDD) - 2 créditos -</text>
      <text x="106" y="339" font-style="italic">Concluído</text>
      <text x="106" y="349"><tspan font-weight="700">WDD131</tspan> (WDD) - 2 créditos -</text>
      <text x="106" y="356" font-style="italic">Concluído</text>
      <text x="106" y="366"><tspan font-weight="700">CSE111</tspan> (CSE) - 2 créditos -</text>
      <text x="106" y="373" font-style="italic">Concluído</text>
      <text x="106" y="383"><tspan font-weight="700">CSE210</tspan> (CSE) - 2 créditos -</text>
      <text x="106" y="390" font-style="italic">Em andamento</text>
