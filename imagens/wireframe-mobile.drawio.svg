<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 453 1160" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe Mobile — Página Inicial do Curso WDD 231</title>
  <desc id="desc">Página móvel longa com cabeçalho fixo, cards empilhados, painel branco de cursos e rodapé como na referência visual.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1">
      <stop stop-color="#f5f3ef"/>
      <stop offset="1" stop-color="#efeee9"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#17343a" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="453" height="1160" fill="#3b3b3b"/>
  <rect x="35" y="8" width="388" height="1144" rx="9" fill="url(#bg)"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#083d4d">
