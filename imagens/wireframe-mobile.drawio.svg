    <path d="M35 77h388v9H35z" fill="#fff"/>
    <path d="M50 44 71 25a5 5 0 0 1 7 0l21 19v21a4 4 0 0 1-4 4H82V52a7 7 0 0 0-14 0v17H54a4 4 0 0 1-4-4z" fill="#287db0"/>
    <path d="M72 69V52a4 4 0 0 1 8 0v17z" fill="#875b2c"/>
    <text x="111" y="54" font-size="22" font-weight="700" letter-spacing=".5">Fabio Ricardo</text>
    <circle cx="385" cy="47" r="21.5" fill="#fff" stroke="#0b5d7a" stroke-width="1"/>
    <path d="M376 39h18M376 47h18M376 55h18" stroke="#083d4d" stroke-width="1.8"/>

    <text x="51" y="134" font-size="31" font-weight="700">Página Inicial do</text>
    <text x="51" y="170" font-size="31" font-weight="700">Curso</text>

