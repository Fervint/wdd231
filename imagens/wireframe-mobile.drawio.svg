      <text x="68" y="810"><tspan font-weight="700">WDD130</tspan> (WDD) - 2 crédito(s) - <tspan font-style="italic">Concluído</tspan></text>
      <text x="68" y="837"><tspan font-weight="700">WDD131</tspan> (WDD) - 2 crédito(s) - <tspan font-style="italic">Concluído</tspan></text>
      <text x="68" y="864"><tspan font-weight="700">CSE111</tspan> (CSE) - 2 crédito(s) - <tspan font-style="italic">Concluído</tspan></text>
      <text x="68" y="891"><tspan font-weight="700">CSE210</tspan> (CSE) - 2 crédito(s) - <tspan font-style="italic">Em andamento</tspan></text>
      <text x="68" y="918"><tspan font-weight="700">WDD231</tspan> (WDD) - 2 crédito(s) -</text>
