      <rect x="51" y="193" width="356" height="126" rx="17" fill="#fff" stroke="#d5dde0"/>
      <rect x="51" y="336" width="356" height="127" rx="17" fill="#fff" stroke="#d5dde0"/>
      <rect x="51" y="480" width="356" height="127" rx="17" fill="#fff" stroke="#d5dde0"/>
    </g>
    <g font-size="22" font-weight="700">
